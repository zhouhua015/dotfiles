# status bar
set-option -g status on

set -g status-interval 5
set -g status-justify centre # center align window list
set -g status-left-length 0
set -g status-right-length 0
# set -g status-left-length 20
# set -g status-right-length 140
set -g status-left '#[fg=green]#H #[fg=black]• #[fg=green,bright]#(uname -r | cut -c 1-6) #[fg=black]• #[fg=red,dim,bg=default]#(uptime | cut -f 4-5 -d " " | cut -f 1 -d ",")#[default]'
set -g status-right '#(~/.tmux/plugins/tmux-agent-notifications/scripts/notification-reader.sh | sed -Ef ~/.tmux/agent-notifications.sed)#{W:#{P:#{?@pi_status,#[fg=#e4e4e4]π (w#{window_index}.#{pane_index}): #{@pi_status} #[fg=black]• #[default],}}}#[fg=green,bg=default,bright]#(tmux-mem-cpu-load -i 1)'

# run-shell "powerline-daemon -q"
# source "/usr/share/powerline/bindings/tmux/powerline.conf"

# C-b is not acceptable -- Vim uses it
set-option -g prefix C-a
bind-key C-a last-window

# Start numbering at 1
set -g base-index 1

# Allows for faster key repetition
set -s escape-time 0

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Allow `Modified Enter` keys in pi-coding-agent to work, see
# `https://github.com/badlogic/pi-mono/blob/main/packages/coding-agent/docs/tmux.md`
# for details
set -g extended-keys on
set -g extended-keys-format csi-u

# Vi copypaste mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# disallow window rename
set-window-option -g allow-rename off
set-window-option -g automatic-rename off
set -g window-status-format '#I:#W#(~/.tmux/plugins/tmux-window-notifier/scripts/status.sh indicator #{window_id})#{?window_flags,#{window_flags}, }'
set -g window-status-current-format '#I:#W#(~/.tmux/plugins/tmux-window-notifier/scripts/status.sh indicator #{window_id})#{?window_flags,#{window_flags}, }'
# set -g default-terminal "screen-256color"

# attach to exist seesion
# new-session -n $HOST

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'jsec/tmux-paper-color'
set -g @plugin 'RatulMaharaj/tmux-agent-status'
set -g @plugin 'kaiiserni/tmux-agent-notifications'
set -g @plugin 'mrf/tmux-window-notifier'
# set -g @plugin 'mattdavis90/base16-tmux'
# set -g @colors-base16 'darktooth'
# set -g @colors-base16 'default-dark'
# set -g @colors-base16 'google-light'
# set -g @plugin 'seebi/tmux-colors-solarized'
# set -g @colors-solarized 'light'
set -g @resurrect-strategy-vim 'session'

set -g @agent_status_agents 'claude codex pi agy'
set -g @agent_status_icon_claude '✳'
set -g @agent_status_icon_codex '🔷'
set -g @agent_status_icon_pi 'π'
set -g @agent_status_icon_agy '✦'
set -g @agent_status_notify ''
#
# # Other examples:
# # set -g @plugin 'github_username/plugin_name'
# # set -g @plugin 'git@github.com/user/plugin'
# # set -g @plugin 'git@bitbucket.com/user/plugin'
#
#

set-option -a terminal-features 'xterm-256color:RGB'
# Initialize plugins before applying local status colors.
run '~/.tmux/plugins/tpm/tpm'
set -g status on
bind-key -T prefix n next-window
bind-key -T prefix N run-shell '/home/zhouhua/.tmux/plugins/tmux-agent-notifications/scripts/next-notification.sh'
